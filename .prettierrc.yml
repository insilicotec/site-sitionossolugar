# Prettier Configuration
# https://prettier.io/docs/en/configuration.html

# Basic formatting
semi: true
singleQuote: true
quoteProps: 'as-needed'
trailingComma: 'es5'
tabWidth: 2
useTabs: false

# Print width and line breaks
printWidth: 100
endOfLine: 'lf'

# JSX specific
jsxSingleQuote: false
jsxBracketSameLine: false

# Object and array formatting
bracketSpacing: true
arrowParens: 'avoid'

# File-specific overrides
overrides:
  - files: '*.md'
    options:
      printWidth: 80
      proseWrap: 'always'

  - files: '*.json'
    options:
      printWidth: 120

  - files: '*.{css,scss,less}'
    options:
      singleQuote: false
